name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Real projects run their tests here and write coverage/lcov.info.

      # Pull requests from forks get neither secrets nor an OIDC token, so the
      # upload happens in coverage-relay.yml instead, from the coverage file
      # saved as an artifact below.
      - name: Publish coverage to Qlty
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: coverage/lcov.info

      - name: Save coverage for the relay
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@v4
        with:
          name: coverage-relay
          path: coverage/lcov.info
          retention-days: 1
